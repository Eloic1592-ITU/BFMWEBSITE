<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Countdown</title>
    <link rel="stylesheet" href="./assets/flip.min.css" />
    <link rel="stylesheet" href="./assets/countdown.css" />
  </head>
  <body>
    <div class="countdown">
      <div class="countdown-head">
        <img src="./assets/bfm50logo.png" alt="bfm50logo" class="bfm50logo" />
        <div id="remainingDays">Jour</div>
      </div>
      <a class="countdown-link" href="nouvelle-page.html"></a>
    </div>

    <script>
        function removeTimeFromDate(date) {
            return new Date(date.getFullYear(), date.getMonth(), date.getDate());
        }


        function differenceEnJours(date1, date2) {
            var dateSansHeure1 = removeTimeFromDate(date1);
            var dateSansHeure2 = removeTimeFromDate(date2);

            var differenceEnMillisecondes = dateSansHeure2.getTime() - dateSansHeure1.getTime();
            var differenceDate = Math.ceil(differenceEnMillisecondes / (1000 * 3600 * 24));

            const remainingDaysElement = document.getElementById("remainingDays");

            if(differenceDate == 0) {
                remainingDaysElement.textContent = `Jour J`;
            } else {
                remainingDaysElement.textContent = `Jour J+${differenceDate}`;
            }
        }

        var date_debut = new Date('2024-05-06');
        var date_fin = new Date(); // Date actuelle

        setInterval(differenceEnJours(date_debut, date_fin), 1000);

    </script>
    <script src="./assets/flip.min.js"></script>
  </body>
</html>
