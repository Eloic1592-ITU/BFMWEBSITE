server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Servir directement les assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    # Toutes les autres routes renvoient vers index.html (routing Angular)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

