<div class="breadcrumb"><a [routerLink]="['/']" title="Accueil">Accueil</a>

</div>

<div class="page-content galerie-media">
	<!-- Titre de la gallerie -->
	 <h1> {{ title }}</h1>
	<!-- Titre de la gallerie -->

	<div class="galerie-photo">
		<h2>Galerie photos</h2>	
		<div class="row">
			<div class= "col-md-4" *ngFor="let item of albumData">
				<div class="item">
					<a href="{{item.link}}">
						<figure>

							<img [defaultImage]="loadingAnimation" [lazyLoad]="item.visuel" [offset]="offset" [errorImage]="errorImage" alt="{{item.title}}" title="{{item.title}}">
						</figure>
						<span>{{item.title}}</span>
					</a>
				</div>
			</div>
		</div>
	</div>

	<hr>

	<div class="galerie-video">
