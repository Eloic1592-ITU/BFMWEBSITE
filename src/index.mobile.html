    <style>
        .loader {
            opacity: 0;
            visibility: hidden;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #fff;
            z-index: 1000;
            transition: all 1s ease;
        }

        .loader img {
            position: absolute;
            top: 50%;
            left: 50%;
            margin-left: -100px;
            margin-top: -100px;
        }

        body.loading {
            overflow: hidden;
        }

        body.loading .loader {
            opacity : 1;
            visibility: visible;
            transition: none;
        }
    </style>
</head>
