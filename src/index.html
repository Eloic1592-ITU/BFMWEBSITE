    <style>
        .loader {
            opacity: 0;
            visibility: hidden;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #fff;
            z-index: 1000;
            transition: all 1s ease;
        }

        .loader .img-loader, .loader .loader-text {
            position: absolute;
            top: 50%;
            left: 50%;
            margin-left: -100px;
            margin-top: -100px;
        }

        .loader .loader-text {
            margin: 0;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
        }

        .loader .loader-text figure {
            width: 100%;
            margin: 0 auto;
        }

        .loader .loader-text .message {
            font-family: 'Open Sans', sans-serif;
            font-size: 12px;
            color: #fff;
            display: block;
            text-align: center;
        }

        body.loading {
            overflow: hidden;
        }

        body.loading .loader {
            opacity : 1;
            visibility: visible;
            transition: none;
        }
    </style>
    <script type="text/javascript">
        navigator.sayswho= (function(){
            var ua= navigator.userAgent, tem,
                M= ua.match(/(opera|chrome|safari|firefox|msie|trident(?=\/))\/?\s*(\d+)/i) || [];
            if(/trident/i.test(M[1])){
                tem=  /\brv[ :]+(\d+)/g.exec(ua) || [];
                return 'IE '+(tem[1] || '');
            }
            if(M[1]=== 'Chrome'){
                tem= ua.match(/\b(OPR|Edge)\/(\d+)/);
                if(tem!= null) return tem.slice(1).join(' ').replace('OPR', 'Opera');
            }
            M= M[2]? [M[1], M[2]]: [navigator.appName, navigator.appVersion, '-?'];
            if((tem= ua.match(/version\/(\d+)/i))!= null) M.splice(1, 1, tem[1]);
            // return M.join(' ');
            return M;
        })();

        if ( (navigator.sayswho[0].toLowerCase() == 'msie' && parseInt(navigator.sayswho[1]) < 11) || (navigator.sayswho[0].toLowerCase() == 'firefox' && parseInt(navigator.sayswho[1]) < 52) || (navigator.sayswho[0].toLowerCase() == 'safari' && parseInt(navigator.sayswho[1]) < 9) ) {
            window.location.href = 'upgrade.html';
        };

    </script>
